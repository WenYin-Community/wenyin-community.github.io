<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title data-zh="页面未找到 - 404 错误" data-en="Page Not Found - 404 Error">页面未找到 - 404 错误</title>
    <meta name="description" content="The page you are looking for could not be found.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon/favicon.ico">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="./assets/css/style.css" rel="stylesheet">

    <style>
        .error-code {
            font-family: var(--font-display);
            font-size: 10rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 8px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
        }

        .error-message {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 0.75rem;
        }

        .error-description {
            font-size: 1.1rem;
            opacity: 0.7;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            border-color: rgba(255, 255, 255, 0.6);
            color: #fff;
            transform: translateY(-2px);
        }

        .error-404-icon {
            font-size: 2.5rem;
            opacity: 0.5;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 767.98px) {
            .error-code {
                font-size: 6rem;
                letter-spacing: 4px;
            }

            .error-message {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>
    <!-- 404 页面（Mimo风格水墨遮罩 + 紫色主题） -->
    <section class="hero-mimo" id="hero">
        <div class="hero__bg" aria-hidden="true"></div>
        <canvas class="hero__mask" id="inkCanvas" aria-hidden="true"></canvas>
        <div class="hero-content container text-center text-white">
            <div class="error-404-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="error-code">404</div>
            <h2 class="error-message" data-zh="页面未找到" data-en="Page Not Found">页面未找到</h2>
            <p class="error-description" data-zh="抱歉，您访问的页面不存在或已被移除。" data-en="Sorry, the page you are looking for does not exist or has been removed.">抱歉，您访问的页面不存在或已被移除。</p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="/" class="btn-home">
                    <i class="fas fa-home"></i><span data-zh="返回首页" data-en="Back to Home">返回首页</span>
                </a>
                <a href="javascript:history.back()" class="btn-back">
                    <i class="fas fa-arrow-left"></i><span data-zh="返回上一页" data-en="Go Back">返回上一页</span>
                </a>
            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
